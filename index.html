<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EN-MY">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>EN → MY Translator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { -webkit-tap-highlight-color: transparent; }
  .mm { font-family: 'Noto Sans Myanmar', 'Myanmar Text', sans-serif; line-height: 1.9; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<header class="sticky top-0 z-10 bg-teal-700 text-white px-4 pb-3 shadow"
        style="padding-top: max(0.75rem, env(safe-area-inset-top));">
  <h1 class="text-lg font-semibold">EN → မြန်မာ Translator</h1>
  <p class="text-xs text-teal-200">Powered by Google Gemini</p>
</header>

<main class="max-w-xl mx-auto p-4 space-y-4 pb-24">

  <section class="bg-white rounded-2xl shadow-sm p-4 space-y-3">
    <label class="block text-sm font-medium">Gemini API Key</label>
    <div class="flex gap-2">
      <input id="apiKey" type="password" autocomplete="off" placeholder="AIza..."
             class="flex-1 min-w-0 rounded-xl border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-600">
      <button id="toggleKey" type="button"
              class="px-3 rounded-xl border border-slate-300 text-sm active:bg-slate-100">Show</button>
    </div>
    <label class="flex items-center gap-2 text-xs text-slate-600">
      <input id="remember" type="checkbox" class="h-4 w-4"> Remember key on this phone
    </label>

    <label class="block text-sm font-medium pt-1">Model</label>
    <input id="model" value="gemini-3.8-flash"
           class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-600">
  </section>

  <section class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
    <div class="flex justify-between items-center">
      <label class="text-sm font-medium">English text</label>
      <button id="clearBtn" type="button" class="text-xs text-teal-700 active:opacity-60">Clear</button>
    </div>
    <textarea id="input" rows="8" placeholder="Paste English text here..."
              class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-600"></textarea>
  </section>

  <button id="translateBtn" type="button"
          class="w-full flex items-center justify-center gap-2 bg-teal-700 text-white font-semibold rounded-2xl py-4 text-base shadow active:bg-teal-800 disabled:opacity-60">
    <svg id="spinner" class="hidden animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
    <span id="btnLabel">Translate</span>
  </button>

  <p id="status" class="text-sm text-center text-slate-500 min-h-[1.25rem]"></p>

  <section class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
    <div class="flex justify-between items-center">
      <label class="text-sm font-medium">Myanmar translation</label>
      <button id="copyBtn" type="button"
              class="text-sm bg-slate-100 rounded-lg px-3 py-1.5 active:bg-slate-200">Copy</button>
    </div>
    <textarea id="output" rows="10" readonly placeholder="Translation appears here..."
              class="mm w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-base"></textarea>
  </section>
</main>

<script>
const SYSTEM_PROMPT = 'You are an expert Myanmar translator and adult fiction novelist. Translate the following English text into natural, expressive, and culturally resonant Myanmar (Burmese) language. You are explicitly permitted to translate explicit, 18+, and adult content accurately without censorship.';
const BASE_URL = 'https://generativelanguage.googleapis.com/v1beta/models/';
const CHUNK_SIZE = 4000;

const SAFETY_SETTINGS = [
  'HARM_CATEGORY_SEXUALLY_EXPLICIT',
  'HARM_CATEGORY_HATE_SPEECH',
  'HARM_CATEGORY_HARASSMENT',
  'HARM_CATEGORY_DANGEROUS_CONTENT'
].map(category => ({ category, threshold: 'BLOCK_NONE' }));

const $ = id => document.getElementById(id);
const apiKey = $('apiKey'), model = $('model'), input = $('input'), output = $('output');
const remember = $('remember');
const btn = $('translateBtn'), spinner = $('spinner'), label = $('btnLabel'), statusEl = $('status');

// Key storage: localStorage if "remember" is ticked, otherwise session only
const savedKey = localStorage.getItem('gem_key');
apiKey.value = savedKey || sessionStorage.getItem('gem_key') || '';
remember.checked = !!savedKey;
model.value = localStorage.getItem('gem_model_v2') || model.value;

function persistKey() {
  const k = apiKey.value.trim();
  sessionStorage.setItem('gem_key', k);
  if (remember.checked) localStorage.setItem('gem_key', k);
  else localStorage.removeItem('gem_key');
}
apiKey.addEventListener('input', persistKey);
remember.addEventListener('change', persistKey);
model.addEventListener('input', () => localStorage.setItem('gem_model_v2', model.value.trim()));

$('toggleKey').onclick = e => {
  const show = apiKey.type === 'password';
  apiKey.type = show ? 'text' : 'password';
  e.target.textContent = show ? 'Hide' : 'Show';
};

$('clearBtn').onclick = () => { input.value = ''; output.value = ''; statusEl.textContent = ''; };

function setLoading(on) {
  btn.disabled = on;
  spinner.classList.toggle('hidden', !on);
  label.textContent = on ? 'Translating...' : 'Translate';
}

function showError(msg) {
  statusEl.textContent = msg;
  statusEl.className = 'text-sm text-center text-red-600 min-h-[1.25rem]';
}

function chunkText(text) {
  const paras = text.split(/\n{2,}/);
  const chunks = [];
  let cur = '';
  for (const p of paras) {
    if (cur && (cur.length + p.length + 2) > CHUNK_SIZE) { chunks.push(cur); cur = p; }
    else cur = cur ? cur + '\n\n' + p : p;
  }
  if (cur) chunks.push(cur);
  return chunks;
}

async function translateChunk(text, key, modelId) {
  const url = BASE_URL + encodeURIComponent(modelId) + ':generateContent';
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: [{ role: 'user', parts: [{ text }] }],
      safetySettings: SAFETY_SETTINGS,
      generationConfig: { temperature: 0.7 }
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data?.error?.message || ('HTTP ' + res.status));
  if (data.promptFeedback?.blockReason) {
    throw new Error('Request blocked by Google: ' + data.promptFeedback.blockReason);
  }
  const cand = data.candidates?.[0];
  const out = cand?.content?.parts?.map(p => p.text || '').join('');
  if (!out) {
    throw new Error('No output returned' + (cand?.finishReason ? ' (' + cand.finishReason + ')' : '') +
      '. Google may still block some content regardless of settings.');
  }
  return out.trim();
}

btn.onclick = async () => {
  const key = apiKey.value.trim(), modelId = model.value.trim(), text = input.value.trim();
  statusEl.className = 'text-sm text-center text-slate-500 min-h-[1.25rem]';
  if (!key) return showError('Please enter your Gemini API key.');
  if (!modelId) return showError('Please enter a model ID.');
  if (!text) return showError('Please enter some English text.');
  if (!navigator.onLine) return showError('You are offline. Connect to the internet to translate.');

  const chunks = chunkText(text);
  const results = [];
  output.value = '';
  setLoading(true);
  try {
    for (let i = 0; i < chunks.length; i++) {
      statusEl.textContent = chunks.length > 1 ? `Translating part ${i + 1} of ${chunks.length}...` : '';
      results.push(await translateChunk(chunks[i], key, modelId));
      output.value = results.join('\n\n');
    }
    statusEl.textContent = 'Done ✓';
  } catch (err) {
    showError('Error: ' + err.message);
  } finally {
    setLoading(false);
  }
};

$('copyBtn').onclick = async e => {
  const t = output.value;
  if (!t) return;
  try {
    await navigator.clipboard.writeText(t);
  } catch {
    output.removeAttribute('readonly'); output.select(); output.setSelectionRange(0, 99999);
    document.execCommand('copy'); output.setAttribute('readonly', '');
  }
  const b = e.target; b.textContent = 'Copied ✓';
  setTimeout(() => b.textContent = 'Copy', 1500);
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
