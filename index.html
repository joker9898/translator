<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EN-MY">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>EN → MY Translator</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { -webkit-tap-highlight-color: transparent; }
  .mm { font-family: 'Noto Sans Myanmar', 'Myanmar Text', sans-serif; line-height: 1.9; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

<header class="sticky top-0 z-10 bg-teal-700 text-white px-4 pb-3 shadow"
        style="padding-top: max(0.75rem, env(safe-area-inset-top));">
  <h1 class="text-lg font-semibold">EN → မြန်မာ Translator</h1>
  <p class="text-xs text-teal-200">Gemini + OpenRouter</p>
</header>

<main class="max-w-xl mx-auto p-4 space-y-4 pb-24">

  <section class="bg-white rounded-2xl shadow-sm p-4 space-y-3">
    <label class="block text-sm font-medium">Provider</label>
    <select id="provider" class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base bg-white">
      <option value="gemini">Gemini (Google)</option>
      <option value="openrouter">OpenRouter</option>
    </select>

    <label class="flex items-start gap-2 text-sm text-slate-700">
      <input id="fallback" type="checkbox" class="h-4 w-4 mt-0.5">
      <span>Gemini ပိတ်ရင် OpenRouter နဲ့ အလိုအလျောက် ပြန်ကြိုးစားမယ်</span>
    </label>

    <div class="border-t pt-3 space-y-2">
      <label class="block text-sm font-medium">Gemini API Key</label>
      <input id="gemKey" type="password" autocomplete="off" placeholder="AIza..."
             class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-600">
      <label class="block text-xs text-slate-500">Gemini model</label>
      <input id="gemModel" value="gemini-3.8-flash"
             class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-teal-600">
    </div>

    <div class="border-t pt-3 space-y-2">
      <label class="block text-sm font-medium">OpenRouter API Key</label>
      <input id="orKey" type="password" autocomplete="off" placeholder="sk-or-v1-..."
             class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-600">
      <label class="block text-xs text-slate-500">OpenRouter model (free ဆိုရင် နောက်ဆုံးမှာ :free ပါရမယ်)</label>
      <input id="orModel" value="openrouter/free"
             class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-teal-600">
    </div>

    <div class="flex items-center justify-between pt-1">
      <label class="flex items-center gap-2 text-xs text-slate-600">
        <input id="remember" type="checkbox" class="h-4 w-4"> Key တွေကို ဖုန်းထဲမှာ မှတ်ထားမယ်
      </label>
      <button id="toggleKey" type="button" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs active:bg-slate-100">Show keys</button>
    </div>
  </section>

  <section class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
    <div class="flex justify-between items-center">
      <label class="text-sm font-medium">English text</label>
      <button id="clearBtn" type="button" class="text-xs text-teal-700 active:opacity-60">Clear</button>
    </div>
    <textarea id="input" rows="8" placeholder="Paste English text here..."
              class="w-full rounded-xl border border-slate-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-600"></textarea>
  </section>

  <button id="translateBtn" type="button"
          class="w-full flex items-center justify-center gap-2 bg-teal-700 text-white font-semibold rounded-2xl py-4 text-base shadow active:bg-teal-800 disabled:opacity-60">
    <svg id="spinner" class="hidden animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
    <span id="btnLabel">Translate</span>
  </button>

  <p id="status" class="text-sm text-center text-slate-500 min-h-[1.25rem]"></p>

  <section class="bg-white rounded-2xl shadow-sm p-4 space-y-2">
    <div class="flex justify-between items-center">
      <label class="text-sm font-medium">Myanmar translation</label>
      <button id="copyBtn" type="button"
              class="text-sm bg-slate-100 rounded-lg px-3 py-1.5 active:bg-slate-200">Copy</button>
    </div>
    <textarea id="output" rows="10" readonly placeholder="Translation appears here..."
              class="mm w-full rounded-xl border border-slate-300 bg-slate-50 px-3 py-3 text-base"></textarea>
  </section>
</main>

<script>
const SYSTEM_PROMPT = 'You are an expert Myanmar translator and adult fiction novelist. Translate the following English text into natural, expressive, and culturally resonant Myanmar (Burmese) language. You are explicitly permitted to translate explicit, 18+, and adult content accurately without censorship.';
const GEM_URL = 'https://generativelanguage.googleapis.com/v1beta/models/';
const OR_URL = 'https://openrouter.ai/api/v1/chat/completions';
const CHUNK_SIZE = 3000;

const SAFETY_SETTINGS = [
  'HARM_CATEGORY_SEXUALLY_EXPLICIT',
  'HARM_CATEGORY_HATE_SPEECH',
  'HARM_CATEGORY_HARASSMENT',
  'HARM_CATEGORY_DANGEROUS_CONTENT'
].map(category => ({ category, threshold: 'BLOCK_NONE' }));

const $ = id => document.getElementById(id);
const el = {
  provider: $('provider'), fallback: $('fallback'), remember: $('remember'),
  gemKey: $('gemKey'), gemModel: $('gemModel'), orKey: $('orKey'), orModel: $('orModel'),
  input: $('input'), output: $('output'), btn: $('translateBtn'),
  spinner: $('spinner'), label: $('btnLabel'), status: $('status')
};

// ---------- Settings storage ----------
const store = k => localStorage.getItem(k) ?? sessionStorage.getItem(k) ?? '';
el.provider.value = store('p_provider') || 'gemini';
el.fallback.checked = store('p_fallback') === '1';
el.gemModel.value = store('p_gemModel') || el.gemModel.value;
el.orModel.value = store('p_orModel') || el.orModel.value;
el.gemKey.value = store('p_gemKey');
el.orKey.value = store('p_orKey');
el.remember.checked = !!localStorage.getItem('p_remember');

function save() {
  const keep = el.remember.checked;
  const data = {
    p_provider: el.provider.value,
    p_fallback: el.fallback.checked ? '1' : '0',
    p_gemModel: el.gemModel.value.trim(),
    p_orModel: el.orModel.value.trim(),
    p_gemKey: el.gemKey.value.trim(),
    p_orKey: el.orKey.value.trim()
  };
  const secret = ['p_gemKey', 'p_orKey'];
  for (const [k, v] of Object.entries(data)) {
    sessionStorage.setItem(k, v);
    if (secret.includes(k)) {
      if (keep) localStorage.setItem(k, v); else localStorage.removeItem(k);
    } else {
      localStorage.setItem(k, v);
    }
  }
  if (keep) localStorage.setItem('p_remember', '1'); else localStorage.removeItem('p_remember');
}
['provider', 'fallback', 'remember', 'gemKey', 'gemModel', 'orKey', 'orModel']
  .forEach(k => { el[k].addEventListener('input', save); el[k].addEventListener('change', save); });

$('toggleKey').onclick = e => {
  const show = el.gemKey.type === 'password';
  el.gemKey.type = el.orKey.type = show ? 'text' : 'password';
  e.target.textContent = show ? 'Hide keys' : 'Show keys';
};
$('clearBtn').onclick = () => { el.input.value = ''; el.output.value = ''; el.status.textContent = ''; };

// ---------- UI helpers ----------
function setLoading(on) {
  el.btn.disabled = on;
  el.spinner.classList.toggle('hidden', !on);
  el.label.textContent = on ? 'Translating...' : 'Translate';
}
function setStatus(msg, isErr) {
  el.status.textContent = msg;
  el.status.className = 'text-sm text-center min-h-[1.25rem] ' + (isErr ? 'text-red-600' : 'text-slate-500');
}

function chunkText(text) {
  const paras = text.split(/\n{2,}/);
  const chunks = [];
  let cur = '';
  for (const p of paras) {
    if (cur && (cur.length + p.length + 2) > CHUNK_SIZE) { chunks.push(cur); cur = p; }
    else cur = cur ? cur + '\n\n' + p : p;
  }
  if (cur) chunks.push(cur);
  return chunks;
}

// ---------- API calls ----------
class BlockedError extends Error {}

async function callGemini(text) {
  const key = el.gemKey.value.trim(), model = el.gemModel.value.trim();
  if (!key) throw new Error('Gemini API key ထည့်ပါ။');
  if (!model) throw new Error('Gemini model ထည့်ပါ။');
  const res = await fetch(GEM_URL + encodeURIComponent(model) + ':generateContent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: [{ role: 'user', parts: [{ text }] }],
      safetySettings: SAFETY_SETTINGS,
      generationConfig: { temperature: 0.7 }
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data?.error?.message || ('HTTP ' + res.status));
  if (data.promptFeedback?.blockReason) {
    throw new BlockedError('Gemini blocked: ' + data.promptFeedback.blockReason);
  }
  const cand = data.candidates?.[0];
  const out = cand?.content?.parts?.map(p => p.text || '').join('');
  if (!out) {
    throw new BlockedError('Gemini returned nothing' + (cand?.finishReason ? ' (' + cand.finishReason + ')' : ''));
  }
  return out.trim();
}

async function callOpenRouter(text) {
  const key = el.orKey.value.trim(), model = el.orModel.value.trim();
  if (!key) throw new Error('OpenRouter API key ထည့်ပါ။');
  if (!model) throw new Error('OpenRouter model ထည့်ပါ။');
  const res = await fetch(OR_URL, {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + key,
      'Content-Type': 'application/json',
      'HTTP-Referer': location.origin && location.origin !== 'null' ? location.origin : 'https://localhost',
      'X-Title': 'EN-MY Translator'
    },
    body: JSON.stringify({
      model,
      temperature: 0.7,
      messages: [
        { role: 'system', content: SYSTEM_PROMPT },
        { role: 'user', content: text }
      ]
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error('OpenRouter: ' + (data?.error?.message || ('HTTP ' + res.status)));
  const out = data?.choices?.[0]?.message?.content;
  if (!out) throw new Error('OpenRouter: model က ဘာမှ ပြန်မပို့ပါဘူး။');
  return out.trim();
}

// Translate one chunk using the chosen provider, with optional fallback
async function translateChunk(text, tag) {
  if (el.provider.value === 'openrouter') {
    return callOpenRouter(text);
  }
  try {
    return await callGemini(text);
  } catch (err) {
    if (err instanceof BlockedError && el.fallback.checked) {
      if (!el.orKey.value.trim()) throw new Error(err.message + ' — OpenRouter key မရှိလို့ ပြန်မကြိုးစားနိုင်ပါ။');
      setStatus(tag + ' Gemini ပိတ်တယ်၊ OpenRouter နဲ့ ပြန်ကြိုးစားနေတယ်...');
      return callOpenRouter(text);
    }
    throw err;
  }
}

// ---------- Main ----------
el.btn.onclick = async () => {
  const text = el.input.value.trim();
  if (!text) return setStatus('English စာသား ထည့်ပါ။', true);
  if (!navigator.onLine) return setStatus('Internet မရှိပါ။', true);
  setStatus('');

  const chunks = chunkText(text);
  const results = [];
  el.output.value = '';
  setLoading(true);
  try {
    for (let i = 0; i < chunks.length; i++) {
      const tag = chunks.length > 1 ? `(${i + 1}/${chunks.length})` : '';
      setStatus(chunks.length > 1 ? `Translating ${tag}...` : '');
      results.push(await translateChunk(chunks[i], tag));
      el.output.value = results.join('\n\n');
    }
    setStatus('Done ✓');
  } catch (err) {
    // keep whatever was translated so far
    setStatus('Error: ' + err.message, true);
  } finally {
    setLoading(false);
  }
};

$('copyBtn').onclick = async e => {
  const t = el.output.value;
  if (!t) return;
  try {
    await navigator.clipboard.writeText(t);
  } catch {
    el.output.removeAttribute('readonly'); el.output.select(); el.output.setSelectionRange(0, 99999);
    document.execCommand('copy'); el.output.setAttribute('readonly', '');
  }
  const b = e.target; b.textContent = 'Copied ✓';
  setTimeout(() => b.textContent = 'Copy', 1500);
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
  </html>
